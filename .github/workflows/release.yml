name: Release

# Read dev_docs/release.md for more information.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate the release without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-release:
    name: Verify Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.93.0

      - name: Verify release metadata
        id: release_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: make _release_verify_github

  lint-and-unit-tests:
    name: Lint And Unit Tests
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Run lint
        run: make lint

      - name: Run unit tests
        run: make tests

  integration-tests:
    name: Integration Tests
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run shell integration tests
        env:
          VERBOSE: 1
          DOCKER_PLATFORM: linux/amd64
        run: make tests_integration

  package-check:
    name: Cargo Publish Dry Run
    needs: verify-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.93.0

      - name: Validate publish package
        run: cargo publish --dry-run --locked

  build-artifacts:
    name: Build ${{ matrix.archive_name }}
    needs: [verify-release, lint-and-unit-tests, integration-tests, package-check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_name: dela-linux-amd64.tar.gz
            artifact_name: dela-linux-amd64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            archive_name: dela-linux-arm64.tar.gz
            artifact_name: dela-linux-arm64
            linker: aarch64-linux-gnu-gcc
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_name: dela-darwin-amd64.tar.gz
            artifact_name: dela-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: dela-darwin-arm64.tar.gz
            artifact_name: dela-darwin-arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.93.0
          targets: ${{ matrix.target }}

      - name: Install Linux cross-compilation tools
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Prepare archive
        shell: bash
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/dela" .
          tar czf "${{ matrix.archive_name }}" dela

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ./${{ matrix.archive_name }}
          if-no-files-found: error

  create-draft-release:
    name: Create Draft GitHub Release
    needs: [verify-release, build-artifacts]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create or update GitHub release contents.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify-release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)
            if [ "${IS_DRAFT}" = "true" ]; then
              echo "Draft release ${TAG_NAME} already exists."
              exit 0
            else
              echo "Error: Published release ${TAG_NAME} already exists. Refusing to operate on a published release."
              exit 1
            fi
          fi

          make _release_notes

          gh release create "${TAG_NAME}" \
            --draft \
            --verify-tag \
            --title "${TAG_NAME}" \
            --notes-file release_notes.md \
            --repo "${GITHUB_REPOSITORY}"

  upload-release-assets:
    name: Upload Draft Release Assets
    needs: [verify-release, build-artifacts, create-draft-release]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create or update GitHub release contents.
    steps:
      - name: Download built archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify-release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${TAG_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"

  publish-crate:
    name: Publish To Crates.io
    needs: [verify-release, build-artifacts, upload-release-assets, npm-package-check]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout.
      id-token: write # Required to request an OIDC token for registry authentication.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.93.0

      - name: Check whether version is already published
        id: crates_version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.verify-release.outputs.version }}"
          RESPONSE=$(curl --fail --silent --show-error --location https://crates.io/api/v1/crates/dela)

          if echo "${RESPONSE}" | jq -e --arg version "${VERSION}" '.versions[] | select(.num == $version)' >/dev/null; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Authenticate with crates.io
        id: crates_io_auth
        if: steps.crates_version.outputs.exists != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish crate
        if: steps.crates_version.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: cargo publish --locked

  npm-package-check:
    name: NPM Package Dry Run
    needs: [verify-release, build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Download built archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Prepare NPM packages
        run: make _npm_release_prep DELA_VERSION="${{ needs.verify-release.outputs.version }}"

      - name: Dry-run package contents
        run: make npm_publish NPM_PUBLISH_DRY_RUN=1

  publish-npm:
    name: Publish To NPM
    needs: [verify-release, publish-crate, npm-package-check]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout.
      id-token: write # Required to request an OIDC token for registry authentication.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download built archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Prepare NPM packages
        run: make _npm_release_prep DELA_VERSION="${{ needs.verify-release.outputs.version }}"

      - name: Publish to NPM
        run: make npm_publish

  publish-github-release:
    name: Publish GitHub Release
    needs: [verify-release, publish-crate, publish-npm]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create or update GitHub release contents.
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.verify-release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" --jq .id)
          gh api \
            --method PATCH \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false
